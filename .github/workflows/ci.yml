name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.14'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install coverage

      - name: Run tests with coverage
        run: |
          coverage run -m pytest tests/ -v --tb=short
          coverage report --include="src/*" --fail-under=75

      - name: Self-scan (analyzer on itself)
        if: matrix.os == 'windows-latest'
        run: |
          python main.py -p src --lang python --no-llm --fail-on none
        continue-on-error: true

      - name: Build exe (Windows)
        if: matrix.os == 'windows-latest'
        run: |
          pip install pyinstaller
          python -m PyInstaller --clean --noconfirm analizador.spec

      - name: Test exe (Windows)
        if: matrix.os == 'windows-latest'
        run: |
          dist\analizador-seguridad\analizador-seguridad.exe -p tests/samples --lang python --no-llm --fail-on none

      - name: Upload exe artifact (Windows)
        if: matrix.os == 'windows-latest'
        uses: actions/upload-artifact@v4
        with:
          name: analizador-seguridad
          path: dist/analizador-seguridad/

  docker:
    runs-on: ubuntu-latest
    needs: test

    steps:
      - uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ghcr.io/${{ github.repository_owner }}/codsec:latest,ghcr.io/${{ github.repository_owner }}/codsec:${{ github.ref_name }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
