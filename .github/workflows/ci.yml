name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.14'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install coverage

      - name: Run tests with coverage
        run: |
          coverage run -m pytest tests/ -v --tb=short
          coverage report --include="src/*" --fail-under=75

      - name: Self-scan (analyzer on itself)
        if: matrix.os == 'windows-latest'
        run: |
          python main.py -p src --lang python --no-llm --fail-on none
        continue-on-error: true

      - name: Build exe (Windows)
        if: matrix.os == 'windows-latest'
        run: |
          pip install pyinstaller
          python -m PyInstaller --clean --noconfirm analizador.spec

      - name: Test exe (Windows)
        if: matrix.os == 'windows-latest'
        run: |
          dist\analizador-seguridad\analizador-seguridad.exe -p tests/samples --lang python --no-llm --fail-on none

      - name: Upload exe artifact (Windows)
        if: matrix.os == 'windows-latest'
        uses: actions/upload-artifact@v4
        with:
          name: analizador-seguridad
          path: dist/analizador-seguridad/
