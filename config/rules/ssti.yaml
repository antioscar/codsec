id: SSTI-001
category: ssti
severity: critical
cwe: CWE-1336
languages:
  - python
  - javascript
  - typescript
  - php
  - go
ast_function_names:
  - render_template_string
  - Template
  - ejs.render
  - compile
  - res.render
  - mustache.render
  - nunjucks.render
  - pug.compile
  - twig.render
regex_patterns:
  - (?i)render_template_string\(
  - (?i)(?<!lib)template\s*\(
  - (?i)\.render\s*\(\s*.*req(uest)?
  - (?i)\.compile\s*\(\s*.*\+\s*
  - (?i)ejs\.render\s*\(
  - (?i)mustache\.render\s*\(
  - (?i)nunjucks\.render\s*\(
  - (?i)pug\.compile\s*\(
  - (?i)twig_loader.*render
  - (?i)html/template.*Execute
description_template: "Posible Server-Side Template Injection (SSTI): entrada de usuario interpolada en plantilla sin sanitización"
remediation: |
  1. Nunca uses render_template_string() con datos de usuario directamente.
  2. Pasa los datos como variables de contexto, no como parte del template.
  3. Sandboxea el motor de plantillas si no podés evitar entradas de usuario.
  4. Usa motores con auto-escape por defecto (Jinja2, Twig).
  5. Validá que la entrada del usuario no contenga sintaxis de plantilla ({{, {%, etc.).
