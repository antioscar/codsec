id: 'SEC-001'
category: hardcoded_secrets
severity: critical
cwe: 'CWE-798'
description_template: Secreto hardcodeado detectado en el código fuente
remediation: '1. Nunca guardes secretos (API keys, contraseñas, tokens) en el código fuente.

  2. Usa variables de entorno (archivos .env) con librerías como python-dotenv.

  3. Usa servicios de gestión de secretos (AWS Secrets Manager, HashiCorp Vault).

  4. En CI/CD, inyecta los secretos como variables de entorno seguras.

  5. Revoca inmediatamente cualquier secreto que haya sido expuesto en el código.

  '
languages:
- python
- javascript
- typescript
- php
- java
- go
- csharp
- ruby
- kotlin
- swift
- rust
ast_node_types: []
ast_function_names: []
regex_patterns:
- '(?i)(api[_-]?key|api[_-]?secret|access[_-]?key|secret[_-]?key|auth[_-]?token)\s*(?::?=|\:)\s*["\x27]([A-Za-z0-9_\-.]{10,})["\x27]'
- '(?i)(password|passwd|pwd|secret)\s*(?::?=|\:)\s*["\x27]([^"\x27]{4,})["\x27]'
- '(?i)(jwt[_-]?secret|signing[_-]?key|encryption[_-]?key)\s*(?::?=|\:)\s*["\x27][^"\x27]+["\x27]'
- '(?i)(DATABASE_URL|DB_URL|MONGO_URI|REDIS_URL)\s*=\s*["\x27][^"\x27]+["\x27]'
- '(?i)(sk-[A-Za-z0-9]{20,})'
- '(?i)(xai-[A-Za-z0-9]{20,})'
- '(?i)(ghp_[A-Za-z0-9]{30,})'
- '(?i)(AKIA[0-9A-Z]{16})'
- '(?i)(SLACK_TOKEN|SLACK_WEBHOOK|DISCORD_TOKEN)\s*=\s*[\"''][^\"'']{10,}[\"'']'
- '(?i)(STRIPE_TEST_KEY|STRIPE_LIVE_KEY|sk_test_|sk_live_)\s*=\s*[\"''][^\"'']{10,}[\"'']'
- '(?i)(AWS_ACCESS_KEY_ID|AWS_SECRET|AWS_SESSION_TOKEN|AWS_ACCOUNT_ID)\s*=\s*[\"''][^\"'']{10,}[\"'']'
- '(?i)(GCP_CREDENTIALS|GOOGLE_APPLICATION_CREDENTIALS|GCLOUD_KEY|GCP_SA_KEY)\s*=\s*[\"'']'
- '(?i)(AZURE_STORAGE_KEY|AZURE_CLIENT_SECRET|AZURE_CONNECTION_STRING)\s*=\s*[\"'']'
- '(?i)(PRIVATE_KEY|RSA_PRIVATE|-----BEGIN\s*(RSA|EC|DSA|OPENSSH)\s*PRIVATE\s*KEY)'
- '(''?i)(MONGODB_URI|MONGO_URL|POSTGRES_URL|MYSQL_URL|SQLALCHEMY_URL)\s*=\s*[\"'']mongodb://|postgres://|mysql://[^\"'']+@'
- '(?i)(ghp_|gho_|ghu_|ghs_|ghr_)[A-Za-z0-9]{30,}'
- '(?i)(heroku_api_key|HEROKU_API_KEY|HEROKU_APP_NAME)\s*=\s*[\"'']'
- '(?i)(NPM_TOKEN|NPM_AUTH_TOKEN|DOCKER_PASSWORD|DOCKER_AUTH)\s*=\s*[\"'']'
