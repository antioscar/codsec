id: SEC-001
category: hardcoded_secrets
severity: critical
cwe: "CWE-798"
description_template: "Secreto hardcodeado detectado en el código fuente"
remediation: |
  1. Nunca guardes secretos (API keys, contraseñas, tokens) en el código fuente.
  2. Usa variables de entorno (archivos .env) con librerías como python-dotenv.
  3. Usa servicios de gestión de secretos (AWS Secrets Manager, HashiCorp Vault).
  4. En CI/CD, inyecta los secretos como variables de entorno seguras.
  5. Revoca inmediatamente cualquier secreto que haya sido expuesto en el código.

languages: [python, javascript, typescript, php, java, go, csharp, ruby, kotlin, swift, rust]

ast_node_types: []

ast_function_names: []

regex_patterns:
  - '(?i)(api[_-]?key|api[_-]?secret|access[_-]?key|secret[_-]?key|auth[_-]?token)\s*(?::?=|\:)\s*["\x27]([A-Za-z0-9_\-.]{10,})["\x27]'
  - '(?i)(password|passwd|pwd|secret)\s*(?::?=|\:)\s*["\x27]([^"\x27]{4,})["\x27]'
  - '(?i)(jwt[_-]?secret|signing[_-]?key|encryption[_-]?key)\s*(?::?=|\:)\s*["\x27][^"\x27]+["\x27]'
  - '(?i)(DATABASE_URL|DB_URL|MONGO_URI|REDIS_URL)\s*=\s*["\x27][^"\x27]+["\x27]'
  - '(?i)(sk-[A-Za-z0-9]{20,})'
  - '(?i)(xai-[A-Za-z0-9]{20,})'
  - '(?i)(ghp_[A-Za-z0-9]{30,})'
  - '(?i)(AKIA[0-9A-Z]{16})'
