id: ZIPSLIP-001
category: zip_slip
severity: high
cwe: CWE-22
languages:
  - python
  - javascript
  - typescript
  - java
  - go
  - csharp
  - php
regex_patterns:
  - (?i)\.extractall\s*\(
  - (?i)extractall\s*\(
  - (?i)\.extract\s*\(
  - (?i)ZipFile\s*\(.*\.extract
  - (?i)ZipInputStream.*getNextEntry(?!.*resolve|.*startsWith|.*\.\.)
  - (?i)tarfile\.extractall\s*\(
  - (?i)\.extractall\(\s*[^)]*(?!.*os\.path\.(basename|normpath|realpath))
  - (?i)unzip\s*\(
  - (?i)zip\.NewReader.*\.Open
  - (?i)ArchiveFile\.ExtractToDirectory
  - (?i)System\.IO\.Compression\.ZipFile\.ExtractToDirectory
  - (?i)ZipArchive.*extractTo
  - (?i)PharData/extractTo
description_template: "Posible Zip-Slip: extracción de archivos comprimidos sin validar rutas con path traversal"
remediation: |
  1. Validá cada entrada del archivo comprimido antes de extraer:
     - Rechazá nombres con "../" o "..\\".
     - Verificá que la ruta resuelta quede dentro del directorio destino.
  2. Usá os.path.realpath() / Path.resolve() para normalizar la ruta y comparar con el destino.
  3. No uses extractall() directamente; iterá sobre las entradas y validá una por una.
  4. Limita el tamaño de extracción para evitar zip bombs.
